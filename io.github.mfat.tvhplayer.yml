app-id: io.github.mfat.tvhplayer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: tvhplayer
separate-locales: false
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: "1"
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  # KWin's title bar button order, for TVHplayer's own title bar on KDE.
  - --filesystem=xdg-config/kwinrc:ro
  - --env=PYTHONPATH=/app/lib/python3.13/site-packages:/app/share/tvhplayer


modules:
  # One FFmpeg for libmpv, libvlc, and the ffmpeg command used for local recordings.
  - name: ffmpeg
    config-opts:
      - --enable-pic
      - --enable-shared
      - --disable-doc
      - --disable-static
      - --enable-gpl
      - --enable-libvpx
      - --enable-libmp3lame
      - --enable-libvorbis
      - --enable-libopus
      - --enable-libdav1d
      - --enable-vaapi
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
        sha256: 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3
        x-checker-data:
          type: anitya
          project-id: 5405
          stable-only: true
          url-template: https://ffmpeg.org/releases/ffmpeg-$version.tar.xz

  # libmpv draws the picture into the window's OpenGL widget, so Qt runs natively on Wayland.
  # Modules as in Celluloid's Flathub manifest, without the parts a TV player does not use
  # (Lua and JavaScript scripting, the mpv command, libopenmpt, rubberband, uchardet).
  - name: libass
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/*.la
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
        x-checker-data:
          type: anitya
          project-id: 1560
          stable-only: true
          url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dalsa=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/applications
      - /share/bash-completion
      - /share/doc
      - /share/icons
      - /share/man
      - /share/zsh
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
        x-checker-data:
          type: anitya
          project-id: 5348
          stable-only: true
          url-template: https://github.com/mpv-player/mpv/archive/v$version.tar.gz

  - name: libdvbpsi
    sources:
      - type: archive
        url: https://download.videolan.org/pub/libdvbpsi/1.3.3/libdvbpsi-1.3.3.tar.bz2
        sha256: 02b5998bcf289cdfbd8757bedd5987e681309b0a25b3ffe6cebae599f7a00112

  - name: libmpeg2
    sources:
      - type: archive
        # libmpeg2.sourceforge.net no longer serves it; same file, same checksum.
        url: https://download.videolan.org/pub/contrib/libmpeg2/libmpeg2-0.5.1.tar.gz
        sha256: dee22e893cb5fc2b2b6ebd60b88478ab8556cb3b93f9a0d7ce8f3b61851871d4
    config-opts:
      - --enable-shared
      - --disable-static

  - name: libvlc
    config-opts:
      - BUILDCC=gcc
      - --disable-a52
      - --disable-lua
      - --disable-qt
      - --disable-ncurses
      - --disable-udev
      - --enable-dvbpsi
      - --enable-libmpeg2
      # No keyring: the app passes its own credentials. 3.0.24 finds libsecret.pc but not its headers.
      - --disable-secret
    post-install:
      - /app/lib/vlc/vlc-cache-gen /app/lib/vlc/plugins
    sources:
      - type: archive
        url: https://get.videolan.org/vlc/3.0.24/vlc-3.0.24.tar.xz
        sha256: e7cab503d1d7d5849b89d2cf0e1ee60d0ef6d012407791b644b9cfc0cc225fdf
        x-checker-data:
          type: anitya
          project-id: 6504
          stable-only: true
          url-template: https://get.videolan.org/vlc/$version/vlc-$version.tar.xz

  - name: libdvbcsa
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - '*.la'
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvbcsa/1.1.0/libdvbcsa-1.1.0.tar.gz
        sha256: 4db78af5cdb2641dfb1136fe3531960a477c9e3e3b6ba19a2754d046af3f456d

  # HDHomeRun network tuners, linked into the built-in server.
  - name: libhdhomerun
    buildsystem: simple
    build-commands:
      - sh build-libhdhomerun.sh . /app
    cleanup:
      - /include
      - /lib/libhdhomerun.a
    sources:
      - type: archive
        url: https://download.silicondust.com/hdhomerun/libhdhomerun_20250815.tgz
        sha256: 879b1bc476c9b93e77ee280a84fc1157e7cc47d43ed9c8398d88a8ac5f35c034
      - type: file
        path: packaging/tvheadend/build-libhdhomerun.sh

  # Built-in server. TVHplayer starts /app/bin/tvheadend on 127.0.0.1 and stops it on quit.
  # No transcoding (VLC decodes), no Vue UI (needs npm; the classic UI is served at /),
  # and nothing the build would download.
  - name: tvheadend
    config-opts:
      - --disable-libav
      - --disable-ffmpeg_static
      - --disable-hdhomerun_static
      - --enable-hdhomerun_client
      - --disable-vue_build
      - --disable-pcloud_cache
      - --disable-avahi
      - --disable-ccache
    # The SDK's flags already define _FORTIFY_SOURCE; Tvheadend's own copy would fail under -Werror.
    make-args:
      - CFLAGS_NO_WERROR=yes
    # install relinks the binary (timestamp.o), so it needs the same setting.
    make-install-args:
      - CFLAGS_NO_WERROR=yes
    cleanup:
      - /share/man
    sources:
      - type: git
        # TVHplayer's fork; see docs/tvheadend-source.md.
        url: https://github.com/mfat/tvheadend.git
        commit: 40e88d4cef2c81e44474e75fd2f1edb232575ceb
        # Tags let support/version name the build (git describe).
        disable-shallow-clone: true
      - type: archive
        url: https://github.com/tvheadend/dtv-scan-tables/archive/31d6fb8f8b86e204518ada99bfb8cf6807c717e5.tar.gz
        sha256: 279a04925ca4d944f6ae8b187bca01d15044789eea50239a56a53b2d81539ace
        dest: data/dvb-scan
      # Without the stamp, the Makefile empties data/dvb-scan and tries to git clone it.
      - type: shell
        commands:
          - touch data/dvb-scan/.stamp


  - pypi-dependencies.yaml

  - name: tvhplayer
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/tvhplayer/icons
      - cp -r tvhplayer/* /app/share/tvhplayer/
      - cp -r icons/* /app/share/tvhplayer/icons/
      - install -D -m755 tvhplayer.sh /app/bin/tvhplayer
      - install -D -m644 io.github.mfat.tvhplayer.desktop -t /app/share/applications/
      - install -D icons/tvhplayer.svg /app/share/icons/hicolor/scalable/apps/io.github.mfat.tvhplayer.svg
      - install -D -m644 io.github.mfat.tvhplayer.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: "https://github.com/mfat/tvhplayer.git"
        tag: v3.5.3
        commit: 4fa41252510b7fb3795c47fee3fc2e44c472bd85  
