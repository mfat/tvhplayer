app-id: io.github.mfat.tvhplayer
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.8'
command: tvhplayer
separate-locales: false
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: "1"
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --socket=pulseaudio
  # Recordings to this computer go to the Videos folder by default. Other folders come through the file chooser portal.
  - --filesystem=xdg-videos
  - --talk-name=org.freedesktop.Notifications
  - --env=PYTHONPATH=/app/lib/python3.12/site-packages:/app/share/tvhplayer


modules:
  - name: ffmpeg
    config-opts:
      - --enable-pic
      - --enable-shared
      - --disable-doc
      - --disable-static
      - --enable-gpl
      - --enable-libvpx
      - --enable-libmp3lame
      - --enable-libvorbis
      - --enable-libopus
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-4.4.5.tar.xz
        sha256: f9514e0d3515aee5a271283df71636e1d1ff7274b15853bcd84e144be416ab07

  - name: libdvbpsi
    sources:
      - type: archive
        url: https://download.videolan.org/pub/libdvbpsi/1.3.3/libdvbpsi-1.3.3.tar.bz2
        sha256: 02b5998bcf289cdfbd8757bedd5987e681309b0a25b3ffe6cebae599f7a00112

  - name: libmpeg2
    sources:
      - type: archive
        url: http://libmpeg2.sourceforge.net/files/libmpeg2-0.5.1.tar.gz
        sha256: dee22e893cb5fc2b2b6ebd60b88478ab8556cb3b93f9a0d7ce8f3b61851871d4
    config-opts:
      - --enable-shared
      - --disable-static

  - name: libvlc
    config-opts:
      - BUILDCC=gcc
      - --disable-a52
      - --disable-lua
      - --disable-qt
      - --disable-ncurses
      - --disable-udev
      - --enable-dvbpsi
      - --enable-libmpeg2
    cleanup-commands:
      - /app/lib/vlc/vlc-cache-gen /app/lib/vlc/plugins
    sources:
      - type: archive
        url: https://get.videolan.org/vlc/3.0.21/vlc-3.0.21.tar.xz
        sha256: 24dbbe1d7dfaeea0994d5def0bbde200177347136dbfe573f5b6a4cee25afbb0
        x-checker-data:
          type: anitya
          project-id: 6504
          stable-only: true
          url-template: https://get.videolan.org/vlc/$version/vlc-$version.tar.xz

  - name: libdvbcsa
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - '*.la'
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvbcsa/1.1.0/libdvbcsa-1.1.0.tar.gz
        sha256: 4db78af5cdb2641dfb1136fe3531960a477c9e3e3b6ba19a2754d046af3f456d

  # Built-in server. TVHplayer starts /app/bin/tvheadend on 127.0.0.1 and stops it on quit.
  # No transcoding (VLC decodes), no Vue UI (needs npm; the classic UI is served at /),
  # and nothing the build would download.
  - name: tvheadend
    config-opts:
      - --disable-libav
      - --disable-ffmpeg_static
      - --disable-hdhomerun_static
      - --disable-hdhomerun_client
      - --disable-vue_build
      - --disable-pcloud_cache
      - --disable-avahi
      - --disable-ccache
    # The SDK's flags already define _FORTIFY_SOURCE; Tvheadend's own copy would fail under -Werror.
    make-args:
      - CFLAGS_NO_WERROR=yes
    # install relinks the binary (timestamp.o), so it needs the same setting.
    make-install-args:
      - CFLAGS_NO_WERROR=yes
    cleanup:
      - /share/man
    sources:
      - type: git
        url: https://github.com/tvheadend/tvheadend.git
        commit: 51ec612fa22c4c78b4697e4c262c943da9cbd6cc
        # Tags let support/version name the build (git describe).
        disable-shallow-clone: true
      - type: archive
        url: https://github.com/tvheadend/dtv-scan-tables/archive/31d6fb8f8b86e204518ada99bfb8cf6807c717e5.tar.gz
        sha256: 279a04925ca4d944f6ae8b187bca01d15044789eea50239a56a53b2d81539ace
        dest: data/dvb-scan
      # Without the stamp, the Makefile empties data/dvb-scan and tries to git clone it.
      - type: shell
        commands:
          - touch data/dvb-scan/.stamp


  - pypi-dependencies.yaml

  - name: tvhplayer
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/tvhplayer/icons
      - cp -r tvhplayer/* /app/share/tvhplayer/
      - cp -r icons/* /app/share/tvhplayer/icons/
      - install -D -m755 tvhplayer.sh /app/bin/tvhplayer
      - install -D -m644 io.github.mfat.tvhplayer.desktop -t /app/share/applications/
      - install -D icons/tvhplayer.svg /app/share/icons/hicolor/scalable/apps/io.github.mfat.tvhplayer.svg
      - install -D -m644 io.github.mfat.tvhplayer.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: "https://github.com/mfat/tvhplayer.git"
        tag: v3.5.3
        commit: 4fa41252510b7fb3795c47fee3fc2e44c472bd85  
