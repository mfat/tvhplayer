app-id: io.github.mfat.tvhplayer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: tvhplayer
separate-locales: false
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --socket=pulseaudio
  - --env=PYTHONPATH=/app/lib/python3.13/site-packages:/app/share/tvhplayer


modules:
  # One FFmpeg for libmpv and the ffmpeg command used for local recordings.
  - name: ffmpeg
    config-opts:
      - --enable-pic
      - --enable-shared
      - --disable-doc
      - --disable-static
      - --enable-gpl
      - --enable-libvpx
      - --enable-libmp3lame
      - --enable-libvorbis
      - --enable-libopus
      - --enable-libdav1d
      - --enable-vaapi
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
        x-checker-data:
          type: anitya
          project-id: 5405
          stable-only: true
          url-template: https://ffmpeg.org/releases/ffmpeg-$version.tar.xz

  # libmpv draws the picture into the window's OpenGL widget, so Qt runs natively on Wayland.
  # Modules as in Celluloid's Flathub manifest, without the parts a TV player does not use
  # (Lua and JavaScript scripting, the mpv command, libopenmpt, rubberband, uchardet).
  - name: libass
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/*.la
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
        x-checker-data:
          type: anitya
          project-id: 1560
          stable-only: true
          url-template:
            https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dalsa=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/applications
      - /share/bash-completion
      - /share/doc
      - /share/icons
      - /share/man
      - /share/zsh
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
        x-checker-data:
          type: anitya
          project-id: 5348
          stable-only: true
          url-template: https://github.com/mpv-player/mpv/archive/v$version.tar.gz

  - name: libdvbcsa
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - '*.la'
    sources:
      - type: archive
        url:
          https://download.videolan.org/pub/videolan/libdvbcsa/1.1.0/libdvbcsa-1.1.0.tar.gz
        sha256: 4db78af5cdb2641dfb1136fe3531960a477c9e3e3b6ba19a2754d046af3f456d
      # Its config.guess (2009) predates aarch64; use the SDK's.
      - type: shell
        commands:
          - cp /usr/share/automake-*/config.guess /usr/share/automake-*/config.sub
            .

  # HDHomeRun network tuners, linked into the built-in server.
  - name: libhdhomerun
    buildsystem: simple
    build-commands:
      - sh build-libhdhomerun.sh . /app
    cleanup:
      - /include
      - /lib/libhdhomerun.a
    sources:
      - type: archive
        url: https://download.silicondust.com/hdhomerun/libhdhomerun_20250815.tgz
        sha256: 879b1bc476c9b93e77ee280a84fc1157e7cc47d43ed9c8398d88a8ac5f35c034
      - type: file
        path: packaging/tvheadend/build-libhdhomerun.sh

  # Built-in server. TVHplayer starts /app/bin/tvheadend on 127.0.0.1 and stops it on quit.
  # No transcoding (mpv decodes), no Vue UI (needs npm; the classic UI is served at /),
  # and nothing the build would download.
  - name: tvheadend
    config-opts:
      - --disable-libav
      - --disable-ffmpeg_static
      - --disable-hdhomerun_static
      - --enable-hdhomerun_client
      - --disable-vue_build
      - --disable-pcloud_cache
      - --disable-avahi
      - --disable-ccache
    # The SDK's flags already define _FORTIFY_SOURCE; Tvheadend's own copy would fail under -Werror.
    make-args:
      - CFLAGS_NO_WERROR=yes
    # install relinks the binary (timestamp.o), so it needs the same setting.
    make-install-args:
      - CFLAGS_NO_WERROR=yes
    cleanup:
      - /share/man
    sources:
      - type: git
        # TVHplayer's fork; see docs/tvheadend-source.md.
        url: https://github.com/mfat/tvheadend.git
        commit: 40e88d4cef2c81e44474e75fd2f1edb232575ceb
        # Tags let support/version name the build (git describe).
        disable-shallow-clone: true
      - type: archive
        url:
          https://github.com/tvheadend/dtv-scan-tables/archive/31d6fb8f8b86e204518ada99bfb8cf6807c717e5.tar.gz
        sha256: 279a04925ca4d944f6ae8b187bca01d15044789eea50239a56a53b2d81539ace
        dest: data/dvb-scan
      # Without the stamp, the Makefile empties data/dvb-scan and tries to git clone it.
      - type: shell
        commands:
          - touch data/dvb-scan/.stamp


  - pypi-dependencies.yaml

  - name: tvhplayer
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/tvhplayer/icons
      - cp -r tvhplayer/* /app/share/tvhplayer/
      - cp -r icons/* /app/share/tvhplayer/icons/
      - install -D -m755 tvhplayer.sh /app/bin/tvhplayer
      - install -D -m644 io.github.mfat.tvhplayer.desktop -t /app/share/applications/
      - install -D icons/tvhplayer.svg /app/share/icons/hicolor/scalable/apps/io.github.mfat.tvhplayer.svg
      - install -D -m644 io.github.mfat.tvhplayer.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/mfat/tvhplayer.git
        tag: v4.4.1
        commit: e6a550e950a99e143a1ebebef53b4f468cce1936
