name: macOS build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'macos/**'
      - 'packaging/render_icon.py'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew's libraries need the macOS they were built for or newer.
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "label=ci${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install verified Python 3.15.0 (official macOS package)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/python-3.15.0-macos11.pkg" \
            'https://www.python.org/ftp/python/3.15.0/python-3.15.0-macos11.pkg'
          echo "7c7e7eca61cbfa5f0c6f80cd594cddbfd492f4e8b3fb87e3d9fa1efebaec43ed  $RUNNER_TEMP/python-3.15.0-macos11.pkg" | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/python-3.15.0-macos11.pkg" -target / >/dev/null
          /Library/Frameworks/Python.framework/Versions/3.15/bin/python3.15 --version

      - name: Install pinned build dependencies
        shell: bash
        run: |
          set -euo pipefail
          /Library/Frameworks/Python.framework/Versions/3.15/bin/python3.15 -m venv "$RUNNER_TEMP/tvhplayer-venv"
          "$RUNNER_TEMP/tvhplayer-venv/bin/python" -m pip install -r macos/requirements-build.txt
          "$RUNNER_TEMP/tvhplayer-venv/bin/python" -m pip check
          echo "$RUNNER_TEMP/tvhplayer-venv/bin" >> "$GITHUB_PATH"

      - name: Install mpv from Homebrew
        run: |
          brew install mpv
          brew list --versions mpv

      - name: Build the application and disk image
        shell: bash
        run: |
          set -euo pipefail
          bash macos/build-macos.sh
          APP='macos/dist/TVHplayer.app'
          file "$APP/Contents/MacOS/TVHplayer"
          test -f "$APP/Contents/Frameworks/icons/play-fill.svg"
          test -f "$APP/Contents/Frameworks/icons/chromecast.svg"
          test -d "$APP/Contents/Frameworks/pychromecast"
          test -d "$APP/Contents/Frameworks/zeroconf"
          codesign --verify --deep --verbose=2 "$APP"
          bash macos/package-dmg.sh

      # Uninstall Homebrew's mpv and ffmpeg first, so the app can only use its own.
      - name: Start the app
        shell: bash
        run: |
          set -u
          brew uninstall --ignore-dependencies mpv ffmpeg >/dev/null
          LOG="$HOME/Library/Logs/TVHplayer/app.log"
          QT_QPA_PLATFORM=offscreen 'macos/dist/TVHplayer.app/Contents/MacOS/TVHplayer' &
          pid=$!
          sleep 25
          running=yes
          kill -0 "$pid" 2>/dev/null || running=no
          kill "$pid" 2>/dev/null || true
          cat "$LOG" || echo "No log at $LOG"
          [ "$running" = yes ] || { echo "TVHplayer exited within 25 seconds"; exit 1; }
          grep -q 'Playback engine: mpv' "$LOG" || { echo 'mpv was not chosen'; exit 1; }
          grep -q 'Media player created successfully' "$LOG" || { echo 'mpv did not start'; exit 1; }
          ! grep -q 'Error starting application' "$LOG" || { echo 'The app reported a startup error'; exit 1; }
          'macos/dist/TVHplayer.app/Contents/Frameworks/ffmpeg' -hide_banner -version | head -n 1

      - name: Name release files
        run: |
          mkdir -p release-assets
          name="tvhplayer-${{ steps.version.outputs.label }}-macos-${{ matrix.arch }}.dmg"
          cp 'macos/dist/TVHplayer.dmg' "release-assets/$name"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
