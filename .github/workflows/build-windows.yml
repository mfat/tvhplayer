name: Windows build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'windows/**'
      - 'tvhplayer/core/builtin*'
      - 'tvhplayer/core/windows*'
      - 'tvhplayer/core/playlist_sync.py'
      - 'tvhplayer/core/hdhomerun.py'
      - 'tvhplayer/core/backend_bundle.py'
      - 'tvhplayer/windows_backend_setup.py'
      - 'tvhplayer/windows_setup_checks.py'
      - 'tvhplayer/wslc_builtin_supervisor.py'
      - 'tvhplayer/builtin_supervisor.py'
      - 'tvhplayer/tvhplayer.py'
      - 'tvhplayer/setup_wizard.py'
      - 'tests/test_windows_wslc.py'
      - 'tests/test_windows_backend_storage.py'
      - 'tests/test_hdhomerun.py'
      - 'tests/test_builtin_server.py'
      - 'tests/test_tuner_setup.py'
      - 'tests/test_backend_bundle.py'
      - 'tests/test_backend_fingerprint.py'
      - 'tests/test_wslc_lifecycle.py'
      - 'tests/test_windows_backend_setup.py'
      - 'tests/test_windows_setup_checks.py'
      - 'tests/test_windows_prerequisites.py'
      - 'packaging/tvheadend/**'
      - 'packaging/render_icon.py'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/backend-bundle.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to repair using this workflow ref (app version must match; empty builds a CI artifact)
        type: string
        default: ''
      run_wslc_acceptance:
        description: Run packaged install/media tests on a disposable Windows WSLc runner
        type: boolean
        default: false
      force_backend_rebuild:
        description: Rebuild the Linux backend even when a matching backend-<fingerprint> release exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/backend-bundle.yml
    with:
      force_rebuild: ${{ inputs.force_backend_rebuild == true }}
    permissions:
      contents: write

  windows:
    needs: backend
    outputs:
      label: ${{ steps.version.outputs.label }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
            gh release view "$RELEASE_TAG" >/dev/null
            python -c 'import ast, os; from pathlib import Path; tree = ast.parse(Path("tvhplayer/tvhplayer.py").read_text(encoding="utf-8")); version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "APP_VERSION" for t in n.targets)); assert version == os.environ["RELEASE_TAG"][1:], "App version does not match the target release"'
            echo "label=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "label=ci${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Test WSLc contracts without virtualization
        run: |
          python -m pip install pytest -r windows/requirements-build.txt
          python -m pytest tests/test_windows_wslc.py tests/test_windows_backend_storage.py tests/test_hdhomerun.py tests/test_builtin_server.py tests/test_tuner_setup.py tests/test_backend_bundle.py tests/test_backend_fingerprint.py tests/test_wslc_lifecycle.py tests/test_windows_backend_setup.py tests/test_windows_setup_checks.py tests/test_windows_prerequisites.py tests/test_config.py tests/test_logs.py tests/test_pyqt6_ui.py::test_onboarding_cancel_is_not_completion_and_explicit_dismissal_is_saved tests/test_pyqt6_ui.py::test_legacy_offered_flag_does_not_suppress_incomplete_onboarding -q

      - name: Download the offline backend bundle
        uses: actions/download-artifact@v8
        with:
          name: windows-backend
          path: windows/backend/dist

      - name: Verify cached or freshly built backend
        shell: bash
        run: python windows/backend/verify-bundle.py windows/backend/dist

      - name: Build installer and portable ZIP
        shell: bash
        env:
          TVHPLAYER_BACKEND_BUNDLE: ${{ github.workspace }}/windows/backend/dist
        run: windows/build-windows.sh "${{ steps.version.outputs.label }}"

      # Install with the installer, start the installed app without a screen,
      # and read its log: mpv must load and the window come up without an error.
      - name: Install and start the app
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows\dist\*-setup.exe | Select-Object -First 1
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The installer failed with code $($install.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\TVHplayer\TVHplayer.exe'
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 25
          $running = -not $app.HasExited
          if ($running) { Stop-Process -Id $app.Id -Force }
          $log = Join-Path $env:LOCALAPPDATA 'TVHplayer\Logs\app.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No log at $log" }
          if (-not $running) { throw "TVHplayer exited within 25 seconds (code $($app.ExitCode))" }
          if (-not (Select-String -Path $log -Pattern 'Playback engine: mpv' -Quiet)) { throw 'mpv was not chosen' }
          if (-not (Select-String -Path $log -Pattern 'Media player created successfully' -Quiet)) { throw 'mpv did not start' }
          if (Select-String -Path $log -Pattern 'Error starting application' -Quiet) { throw 'The app reported a startup error' }

      - name: Test distributed ZIP and installer upgrade with isolated profiles
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = '${{ steps.version.outputs.label }}'
          $previous = gh release list --repo $env:GITHUB_REPOSITORY --limit 20 --json tagName,isPrerelease,isDraft | ConvertFrom-Json | Where-Object { -not $_.isPrerelease -and -not $_.isDraft -and $_.tagName -ne $currentTag } | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'Could not list previous releases for upgrade acceptance' }
          $baseline = Join-Path $env:RUNNER_TEMP 'tvhplayer-upgrade-baseline'
          New-Item -ItemType Directory -Path $baseline -Force | Out-Null
          $testArgs = @('windows/test-packages.py', '--portable', (Get-ChildItem windows/dist/*-windows-x86_64.zip | Select-Object -First 1).FullName, '--installer', (Get-ChildItem windows/dist/*-setup.exe | Select-Object -First 1).FullName)
          if ($previous) {
            gh release download $previous.tagName --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir $baseline
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous distributed installer' }
            $testArgs += @('--previous-installer', (Get-ChildItem $baseline/*-setup.exe | Select-Object -First 1).FullName)
          }
          python @testArgs
          if ($LASTEXITCODE -ne 0) { throw 'Distributed package acceptance failed' }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: windows/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [windows, acceptance]
    if: >-
      ${{ !cancelled() && needs.windows.result == 'success' &&
          (!inputs.run_wslc_acceptance || needs.acceptance.result == 'success') &&
          (github.ref_type == 'tag' || inputs.release_tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: release-assets
      - name: Upload qualified packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.windows.outputs.label }}
          files: release-assets/*
          fail_on_unmatched_files: true

  acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.run_wslc_acceptance
    needs: [backend, windows]
    runs-on: [self-hosted, Windows, X64, wslc, disposable]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: windows-backend
          path: windows/backend/dist
      - name: Verify backend before real-host acceptance
        shell: bash
        run: python windows/backend/verify-bundle.py windows/backend/dist
      - name: Install test dependencies
        run: python -m pip install -c windows/requirements-build.txt PyQt6 requests psutil
      - name: Real-host media and lifecycle acceptance
        shell: pwsh
        run: |
          wslc version
          if ($LASTEXITCODE -ne 0) { throw 'WSLc is missing' }
          python windows/backend/smoke-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Backend startup failed' }
          python windows/backend/integration-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Playback/recording acceptance failed' }
          python windows/backend/lifecycle-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle acceptance failed' }
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: windows/dist
      - name: Real distributed-package backend acceptance
        shell: pwsh
        run: |
          $zip = (Get-ChildItem windows/dist/*-windows-x86_64.zip | Select-Object -First 1).FullName
          $installer = (Get-ChildItem windows/dist/*-setup.exe | Select-Object -First 1).FullName
          python windows/test-packages.py --portable $zip --installer $installer --exercise-backend
          if ($LASTEXITCODE -ne 0) { throw 'Packaged backend acceptance failed' }
