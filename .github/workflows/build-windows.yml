name: Windows build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'windows/**'
      - 'tvhplayer/core/builtin*'
      - 'tvhplayer/core/windows*'
      - 'tvhplayer/core/playlist_sync.py'
      - 'tvhplayer/core/hdhomerun.py'
      - 'tvhplayer/core/backend_bundle.py'
      - 'tvhplayer/windows_backend_setup.py'
      - 'tvhplayer/wslc_builtin_supervisor.py'
      - 'tvhplayer/builtin_supervisor.py'
      - 'tvhplayer/tvhplayer.py'
      - 'tvhplayer/setup_wizard.py'
      - 'tests/test_windows_wslc.py'
      - 'tests/test_hdhomerun.py'
      - 'tests/test_tuner_setup.py'
      - 'tests/test_backend_bundle.py'
      - 'tests/test_backend_fingerprint.py'
      - 'tests/test_wslc_lifecycle.py'
      - 'packaging/tvheadend/**'
      - 'packaging/render_icon.py'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/backend-bundle.yml'
  workflow_dispatch:
    inputs:
      run_wslc_acceptance:
        description: Run real WSLc tests on a managed Windows host with the wslc runner label
        type: boolean
        default: false
      force_backend_rebuild:
        description: Rebuild the Linux backend even when a matching backend-<fingerprint> release exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/backend-bundle.yml
    with:
      force_rebuild: ${{ inputs.force_backend_rebuild == true }}
    permissions:
      contents: write

  windows:
    needs: backend
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "label=ci${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Test WSLc contracts without virtualization
        run: |
          python -m pip install pytest requests PyQt6 psutil
          python -m pytest tests/test_windows_wslc.py tests/test_hdhomerun.py tests/test_tuner_setup.py tests/test_backend_bundle.py tests/test_backend_fingerprint.py tests/test_wslc_lifecycle.py -q

      - name: Download the offline backend bundle
        uses: actions/download-artifact@v8
        with:
          name: windows-backend
          path: windows/backend/dist

      - name: Verify cached or freshly built backend
        shell: bash
        run: python windows/backend/verify-bundle.py windows/backend/dist

      - name: Build installer and portable ZIP
        shell: bash
        env:
          TVHPLAYER_BACKEND_BUNDLE: ${{ github.workspace }}/windows/backend/dist
        run: windows/build-windows.sh "${{ steps.version.outputs.label }}"

      # Install with the installer, start the installed app without a screen,
      # and read its log: mpv must load and the window come up without an error.
      - name: Install and start the app
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows\dist\*-setup.exe | Select-Object -First 1
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The installer failed with code $($install.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\TVHplayer\TVHplayer.exe'
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 25
          $running = -not $app.HasExited
          if ($running) { Stop-Process -Id $app.Id -Force }
          $log = Join-Path $env:LOCALAPPDATA 'TVHplayer\Logs\app.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No log at $log" }
          if (-not $running) { throw "TVHplayer exited within 25 seconds (code $($app.ExitCode))" }
          if (-not (Select-String -Path $log -Pattern 'Playback engine: mpv' -Quiet)) { throw 'mpv was not chosen' }
          if (-not (Select-String -Path $log -Pattern 'Media player created successfully' -Quiet)) { throw 'mpv did not start' }
          if (Select-String -Path $log -Pattern 'Error starting application' -Quiet) { throw 'The app reported a startup error' }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: windows/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: windows/dist/*

  acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.run_wslc_acceptance
    needs: backend
    runs-on: [self-hosted, Windows, X64, wslc]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: windows-backend
          path: windows/backend/dist
      - name: Verify backend before real-host acceptance
        shell: bash
        run: python windows/backend/verify-bundle.py windows/backend/dist
      - name: Install test dependencies
        run: python -m pip install -c windows/requirements-build.txt PyQt6 requests psutil
      - name: Real-host media and lifecycle acceptance
        shell: pwsh
        run: |
          wslc version
          if ($LASTEXITCODE -ne 0) { throw 'WSLc is missing' }
          python windows/backend/smoke-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Backend startup failed' }
          python windows/backend/integration-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Playback/recording acceptance failed' }
          python windows/backend/lifecycle-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle acceptance failed' }
