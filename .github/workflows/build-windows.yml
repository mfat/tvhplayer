name: Windows build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "label=ci${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        run: windows/build-windows.sh "${{ steps.version.outputs.label }}"

      # Start the app without a screen and read its log: mpv must load and the
      # window must come up without an error.
      - name: Start the app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process -FilePath windows\build\dist\TVHplayer\TVHplayer.exe -PassThru
          Start-Sleep -Seconds 25
          $running = -not $app.HasExited
          if ($running) { Stop-Process -Id $app.Id -Force }
          $log = Join-Path $env:LOCALAPPDATA 'TVHplayer\Logs\app.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No log at $log" }
          if (-not $running) { throw "TVHplayer exited within 25 seconds (code $($app.ExitCode))" }
          if (-not (Select-String -Path $log -Pattern 'Playback engine: mpv' -Quiet)) { throw 'mpv was not chosen' }
          if (-not (Select-String -Path $log -Pattern 'Media player created successfully' -Quiet)) { throw 'mpv did not start' }
          if (Select-String -Path $log -Pattern 'Error starting application' -Quiet) { throw 'The app reported a startup error' }
          # The app runs ffmpeg by name; the build's own must come first.
          $env:PATH = "$PWD\windows\build\dist\TVHplayer\_internal;$env:PATH"
          (Get-Command ffmpeg).Source

      - name: Checksum
        shell: bash
        run: |
          cd windows/dist
          for file in *.zip; do sha256sum "$file" > "$file.sha256"; done

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: windows/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: windows/dist/*
